  - id: eth_dca_below_2400
    name: ETH DCA Below 2400
    version: 1.0.0
    strategy_type: dca
    direction: long
    enabled: true
    tags: [dca, accumulator]
    description: Start staged accumulation when price trades at or below 2400.
    market:
      symbol: ETHUSDT
      venue: hyperliquid
      base_asset: ETH
      quote_asset: USDT
    timeframes:
      trigger: 5m
    indicators:
      - id: rsi14_trigger
        kind: rsi
        timeframe: 5m
        params: { period: 14, source: close }
    signals:
      - id: not_parabolic_downtrend
        kind: regime_state
        timeframe: 1h
        source: { excluded_state: parabolic_downtrend }
    trigger:
      activation:
        - lhs: price.close
          operator: "<="
          rhs: { type: static, value: 2400 }
          timeframe: 5m
    ladder:
      order_sizing_mode: fixed_quote
      base_order_size:
        value: 50
        currency: USDT
      scaling:
        mode: percent_steps
        step_percent: 1.5
        max_orders: 8
        size_multiplier: 1.0
      placement:
        reference_price: activation_price
        place_orders:
          - { type: market, at_activation: true }
          - { type: limit, below_each_step: true }
    budget:
      max_total_investment:
        value: 400
        currency: USDT
    enablement_conditions:
      - lhs: signal.not_parabolic_downtrend
        operator: "=="
        rhs: { type: static, value: 1 }
        timeframe: 1h
    disablement_conditions:
      - lhs: price.close
        operator: "<"
        rhs: { type: static, value: 2100 }
        timeframe: 5m
    execution:
      entry_type: market
      max_reentries: 0
      allowed_sessions: [london, new_york, asia]
    risk:
      position_sizing:
        mode: fixed_quote
        value: 50
        currency: USDT
      stop_loss:
        mode: threshold_disable
        value: 2100
        action_on_hit: pause_and_alert
      take_profit:
        mode: blended_position
        target_percent: 4.0
      max_total_exposure:
        value: 400
        currency: USDT
    telemetry:
      emit_signals: true
      emit_orders: true
      emit_position_updates: true
      emit_pnl_updates: true
      custom_tags: [dca]

  - id: eth_fixed_range_grid_v1
    name: ETH Fixed Range Grid
    version: 1.0.0
    strategy_type: grid
    direction: neutral
    enabled: true
    tags: [grid, pionex_style]
    description: Fixed-range fee-adjusted neutral grid for ETH.
    market:
      symbol: ETHUSDT
      venue: hyperliquid
      base_asset: ETH
      quote_asset: USDT
    timeframes:
      control: 1m
      regime: 15m
    indicators:
      - id: atr15m
        kind: atr
        timeframe: 15m
        params: { period: 14 }
    signals:
      - id: not_breakout_regime
        kind: regime_state
        timeframe: 15m
        source: { excluded_state: breakout }
    activation:
      - lhs: price.close
        operator: ">="
        rhs: { type: static, value: 2300 }
        timeframe: 1m
      - lhs: price.close
        operator: "<="
        rhs: { type: static, value: 2600 }
        timeframe: 1m
    grid:
      lower_bound: 2300
      upper_bound: 2600
      grid_count: 20
      spacing_mode: arithmetic
      order_size_mode: fixed_quote
      order_size:
        value: 30
        currency: USDT
    inventory:
      initial_base_allocation:
        asset: ETH
        value: 0.788
      rebalance_on_start: true
      maintain_inventory_buffer: true
    profit_model:
      capture_per_grid_fill: true
      fee_adjusted: true
    rebalance:
      auto_recenter: false
      recenter_threshold_percent: 0
      recenter_action: pause_and_alert
    enablement_conditions:
      - lhs: signal.not_breakout_regime
        operator: "=="
        rhs: { type: static, value: 1 }
        timeframe: 15m
    disablement_conditions:
      - lhs: price.close
        operator: "<"
        rhs: { type: static, value: 2200 }
        timeframe: 1m
      - lhs: price.close
        operator: ">"
        rhs: { type: static, value: 2700 }
        timeframe: 1m
    execution:
      entry_type: limit
      max_reentries: 0
      allowed_sessions: [london, new_york, asia]
      max_spread_bps: 10
      max_slippage_bps: 12
    risk:
      position_sizing:
        mode: fixed_quote
        value: 30
        currency: USDT
      stop_loss:
        mode: range_escape
        reference: outside_grid_range
        action_on_hit: pause_and_alert
      take_profit:
        mode: fixed_percent
        target_percent: 0.0
      max_total_exposure:
        value: 1200
        currency: USDT
    telemetry:
      emit_signals: true
      emit_orders: true
      emit_position_updates: true
      emit_pnl_updates: true
      custom_tags: [grid]