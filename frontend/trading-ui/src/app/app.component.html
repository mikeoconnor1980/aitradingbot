@if (isAuthenticated) {
<app-sidebar-nav #sidebar (logoutClicked)="onLogout()" />

<main class="app-shell" [class.app-shell--sidebar-collapsed]="!sidebar.expanded">
  <header class="app-shell__header">
    <h1 class="app-shell__title">{{ title }}</h1>

    <div class="app-shell__header-end">
      <a
        class="app-shell__status"
        [ngClass]="statusClass"
        routerLink="/connection"
        [attr.aria-label]="'Connection status: ' + statusLabel + '. Click to view details.'"
      >
        <span class="app-shell__status-dot"></span>
        <span class="app-shell__status-label">{{ statusLabel }}</span>
      </a>

      @if (currentUser) {
        <span class="app-shell__user-name">{{ currentUser.displayName }}</span>
      }

      <a
        mat-icon-button
        class="app-shell__profile-btn"
        routerLink="/profile"
        routerLinkActive="app-shell__profile-btn--active"
        matTooltip="Profile"
        aria-label="Go to profile"
      >
        <mat-icon>account_circle</mat-icon>
      </a>

      <button
        mat-icon-button
        class="app-shell__help-btn"
        (click)="onToggleHelp()"
        matTooltip="Help &amp; Guide"
        aria-label="Open help panel"
      >
        <mat-icon>help_outline</mat-icon>
      </button>
    </div>
  </header>

  <div class="app-shell__content">
    <router-outlet />
  </div>
</main>

<app-help-panel />
} @else {
  <router-outlet />
}
