<mat-card class="json-card">
  <mat-card-header>
    <mat-card-title>JSON Preview</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <button mat-stroked-button type="button" (click)="toggle()">
      {{ show ? "Hide" : "Show" }} Canonical JSON
    </button>

    @if (show) {
      <pre class="json-card__content">{{ formattedJson }}</pre>
    }
  </mat-card-content>
</mat-card>
