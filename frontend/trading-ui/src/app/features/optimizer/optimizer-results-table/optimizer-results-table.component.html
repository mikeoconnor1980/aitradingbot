<div class="optimizer-results-table">
  <table mat-table [dataSource]="results" class="optimizer-results-table__table">
    <ng-container matColumnDef="rank">
      <th mat-header-cell *matHeaderCellDef>Rank</th>
      <td mat-cell *matCellDef="let result">#{{ result.rank }}</td>
    </ng-container>

    <ng-container matColumnDef="signalDescription">
      <th mat-header-cell *matHeaderCellDef>Signal</th>
      <td mat-cell *matCellDef="let result">{{ result.signalDescription }}</td>
    </ng-container>

    <ng-container matColumnDef="fitnessScore">
      <th mat-header-cell *matHeaderCellDef>Fitness</th>
      <td mat-cell *matCellDef="let result">{{ result.fitnessScore | number:"1.2-2" }}</td>
    </ng-container>

    <ng-container matColumnDef="totalPnl">
      <th mat-header-cell *matHeaderCellDef>Total PnL</th>
      <td mat-cell *matCellDef="let result" [class]="getPnlClass(result.totalPnl)">{{ result.totalPnl | number:"1.2-2" }}</td>
    </ng-container>

    <ng-container matColumnDef="winRate">
      <th mat-header-cell *matHeaderCellDef>Win Rate</th>
      <td mat-cell *matCellDef="let result">{{ result.winRate | number:"1.0-2" }}%</td>
    </ng-container>

    <ng-container matColumnDef="maxDrawdown">
      <th mat-header-cell *matHeaderCellDef>Max DD</th>
      <td mat-cell *matCellDef="let result">{{ result.maxDrawdown | number:"1.2-2" }}</td>
    </ng-container>

    <ng-container matColumnDef="totalTrades">
      <th mat-header-cell *matHeaderCellDef>Trades</th>
      <td mat-cell *matCellDef="let result">{{ result.totalTrades }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      class="optimizer-results-table__row"
      [class.optimizer-results-table__row--selected]="row.rank === selectedRank"
      (click)="onSelect(row)">
    </tr>
  </table>
</div>
