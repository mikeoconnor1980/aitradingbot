name: Validate Azure Infrastructure

on:
  pull_request:
    paths:
      - infrastructure/**
      - .github/workflows/deploy-infra.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Bicep
        run: az bicep build --file infrastructure/main.bicep