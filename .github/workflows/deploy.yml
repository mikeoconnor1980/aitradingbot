name: Validate and Deploy Azure Hosting

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Azure environment to deploy
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/tradepilot-api

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore, build, and test .NET
        run: |
          dotnet sln TradePilot.sln remove src/TradePilot.Worker/TradePilot.Worker.csproj || true
          dotnet sln TradePilot.sln remove tests/TradePilot.Worker.Tests/TradePilot.Worker.Tests.csproj || true
          dotnet restore TradePilot.sln
          dotnet build TradePilot.sln -c Release --no-restore
          dotnet test TradePilot.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/trading-ui/package-lock.json
      - name: Build and lint Angular
        working-directory: frontend/trading-ui
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Validate Bicep
        run: az bicep build --file infrastructure/main.bicep

  publish-api-image:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TradePilot.Api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:sha-${{ github.sha }}

  deploy:
    needs: publish-api-image
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
      SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      VPS_WORKER_PUBLIC_IP: ${{ vars.VPS_WORKER_PUBLIC_IP }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Provision infrastructure and API identity
        uses: azure/cli@v2
        with:
          inlineScript: |
            resource_group="rg-tradepilot-${DEPLOYMENT_ENVIRONMENT}"
            az group create --name "$resource_group" --location uksouth
            az deployment group create --name "bootstrap-${GITHUB_SHA}" --resource-group "$resource_group" \
              --template-file infrastructure/main.bicep \
              --parameters environmentName="$DEPLOYMENT_ENVIRONMENT" location=uksouth appName=tradepilot \
                containerImage="${{ env.API_IMAGE }}:${{ needs.publish-api-image.outputs.image-tag }}" \
                sqlAdminLogin="$SQL_ADMIN_LOGIN" sqlAdminPassword="$SQL_ADMIN_PASSWORD" \
                workerPublicIpAddress="$VPS_WORKER_PUBLIC_IP" deployApi=false
      - name: Populate Key Vault secrets
        uses: azure/cli@v2
        with:
          inlineScript: |
            vault="tradepilot-${DEPLOYMENT_ENVIRONMENT}-kv"
            signalr="tradepilot-${DEPLOYMENT_ENVIRONMENT}-signalr"
            storage="tradepilot${DEPLOYMENT_ENVIRONMENT}sa"
            signalr_connection=$(az signalr key list --name "$signalr" --resource-group "rg-tradepilot-${DEPLOYMENT_ENVIRONMENT}" --query primaryConnectionString --output tsv)
            storage_connection=$(az storage account show-connection-string --name "$storage" --resource-group "rg-tradepilot-${DEPLOYMENT_ENVIRONMENT}" --query connectionString --output tsv)
            az keyvault secret set --vault-name "$vault" --name jwt-secret-key --value "$JWT_SECRET_KEY" --only-show-errors
            az keyvault secret set --vault-name "$vault" --name llm-api-key --value "$LLM_API_KEY" --only-show-errors
            az keyvault secret set --vault-name "$vault" --name signalr-connection-string --value "$signalr_connection" --only-show-errors
            az keyvault secret set --vault-name "$vault" --name installer-blob-connection --value "$storage_connection" --only-show-errors
      - name: Deploy API configuration
        id: deploy-api
        uses: azure/cli@v2
        with:
          inlineScript: |
            resource_group="rg-tradepilot-${DEPLOYMENT_ENVIRONMENT}"
            swa_host=$(az staticwebapp show --name "tradepilot-${DEPLOYMENT_ENVIRONMENT}-ui" --resource-group "$resource_group" --query defaultHostname --output tsv)
            az deployment group create --name "api-${GITHUB_SHA}" --resource-group "$resource_group" \
              --template-file infrastructure/main.bicep \
              --parameters environmentName="$DEPLOYMENT_ENVIRONMENT" location=uksouth appName=tradepilot \
                containerImage="${{ env.API_IMAGE }}:${{ needs.publish-api-image.outputs.image-tag }}" \
                sqlAdminLogin="$SQL_ADMIN_LOGIN" sqlAdminPassword="$SQL_ADMIN_PASSWORD" \
                corsAllowedOrigin="https://${swa_host}" workerPublicIpAddress="$VPS_WORKER_PUBLIC_IP" deployApi=true
            api_host=$(az containerapp show --name "tradepilot-${DEPLOYMENT_ENVIRONMENT}-api" --resource-group "$resource_group" --query properties.configuration.ingress.fqdn --output tsv)
            echo "api_host=$api_host" >> "$GITHUB_OUTPUT"
      - name: Deploy Angular frontend
        working-directory: frontend/trading-ui
        env:
          API_HOST: ${{ steps.deploy-api.outputs.api_host }}
          SWA_DEPLOYMENT_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
        run: |
          npm ci
          sed "s|CONTAINER_APP_FQDN|${API_HOST}|g" src/environments/environment.azure.ts > src/environments/environment.ts
          npm run build
          npx swa deploy dist/trading-ui/browser --deployment-token "$SWA_DEPLOYMENT_TOKEN" --env production
      - name: Verify API readiness
        run: curl --fail --retry 12 --retry-delay 10 "https://${{ steps.deploy-api.outputs.api_host }}/health/ready"